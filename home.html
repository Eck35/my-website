<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页  </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(to right, rgb(141, 163, 219), rgb(141, 144, 209));
            color: white;
            text-align: center;
            position: relative; /* 添加这个 */
        }
        .nav {
            margin: 20px 0;
            position: relative; 
            z-index: 2;
        }
        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
        }
        .nav a:hover {
            background: rgba(255,255,255,0.3);
        }
        .content {
            margin-top: 50px;
            position: relative;
            z-index: 2;
        }
        
        /* 星空背景  */
        .stars-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: rgb(131, 222, 255);
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
            /* 添加发光效果让星星更明显 */
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
        }

        /* 不同大小的星星 */
        .star.small {
            width: 1px;
            height: 1px;
        }

        .star.medium {
            width: 2px;
            height: 2px;
        }

        .star.large {
            width: 3px;
            height: 3px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.9); 
        }

        /* 闪烁动画 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 延迟动画，让星星不同步闪烁 */
        .star:nth-child(2n) { animation-delay: 1s; }
        .star:nth-child(3n) { animation-delay: 2s; }
        .star:nth-child(4n) { animation-delay: 0.5s; }
        .star:nth-child(5n) { animation-delay: 1.5s; }
    </style>
    
</head>

<body>
    <!-- 星星背景 -->
    <div class="stars-background" id="stars"></div>
    
    <!-- 原有内容保持不变 -->
    <div class="nav">
        <a href="./index.html">首页</a>
        <a href="./board.html">留言板</a>
    </div>
    
    <div class="content">
        <h1>Welcome to X's website!</h1>
        <p>FLAG:C404{D0_u_kn0w_617hu8?}</p>
    </div>

    <script>
    // 生成星星
    function createStars() {
        const starsContainer = document.getElementById('stars');
        const starCount = 120; // 星星数量
        
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            // 随机大小
            const sizes = ['small', 'medium', 'large'];
            star.classList.add(sizes[Math.floor(Math.random() * sizes.length)]);
            
            // 随机位置
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            
            // 随机动画延迟
            star.style.animationDelay = Math.random() * 3 + 's';
            
            starsContainer.appendChild(star);
        }
    }
    
    // 页面加载时创建星星
    window.addEventListener('load', createStars);
    </script>
</body>
</html>
